<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ asunto }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0d0a14;color:#f6eedf;font-family:Georgia,serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0a14;padding:28px 12px;">
      <tr>
        <td align="center">
          <table data-correo="festival-layout" role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#201a2c;border:1px solid #ffffff1a;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="height:8px;background:linear-gradient(90deg,#e2b75f,#f5dc9a,#e0573b);"></td>
            </tr>
            <tr>
              <td style="padding:32px 28px 12px;text-align:center;">
                <p style="margin:0 0 8px;font-family:Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#e2b75f;">
                  {{ marca }}
                </p>
                <h1 style="margin:0;font-size:28px;line-height:1.25;color:#f6eedf;">{{ titulo }}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 8px;font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#f6eedf;">
                {{ mensaje|linebreaksbr }}
              </td>
            </tr>
            {% if cta_url and cta_texto %}
            <tr>
              <td align="center" style="padding:20px 28px 8px;">
                <a href="{{ cta_url }}" style="display:inline-block;background-color:#e2b75f;color:#1a1205;text-decoration:none;font-family:Arial,sans-serif;font-size:15px;font-weight:800;padding:14px 28px;border-radius:15px;">
                  {{ cta_texto }}
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0;font-family:Arial,sans-serif;font-size:12px;line-height:1.5;color:#a99fb6;word-break:break-all;">
                Si el botón no funciona, copia este enlace:<br />
                <a href="{{ cta_url }}" style="color:#f5dc9a;">{{ cta_url }}</a>
              </td>
            </tr>
            {% endif %}
            <tr>
              <td style="padding:24px 28px 32px;font-family:Arial,sans-serif;font-size:12px;line-height:1.5;color:#a99fb6;">
                {{ nota }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
